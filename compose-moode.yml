services:

  db:
    image: arturim13/katalog-db:raspi
    container_name: mariadb
    restart: always
    security_opt:
      seccomp: unconfined
    environment:
      - MARIADB_ROOT_PASSWORD=example
      - MYSQL_USER=example
      - MYSQL_PASSWORD=example
      - MYSQL_DATABASE=katalog
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - katalog-net
    # THE KEY FIX: a real readiness probe. The container is only "healthy"
    # once MariaDB is actually accepting connections. Other services can
    # then wait on this condition instead of racing the DB's startup.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      # Fallback for older images that lack healthcheck.sh:
      # test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent || mysqladmin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s   # grace window for the slow first-boot initialization

  connector:
    container_name: connector
    image: arturim13/katalog-connector:raspi
    restart: always
    working_dir: /pg
    tty: true
    stdin_open: true
    entrypoint: ["gunicorn", "--workers", "4", "--bind", "0.0.0.0:5000", "app:app"]
    ports:
      - "5000:5000"
    networks:
      - katalog-net
    # Long-form depends_on: wait until the DB reports HEALTHY, not just started.
    # This is what removes the dependency on adminer being up.
    depends_on:
      db:
        condition: service_healthy

# Explicit shared network so name-based DNS resolution (host "db") is
# guaranteed and independent of any other service being present.
networks:
  katalog-net:
    driver: bridge

volumes:
  db-data:
