services:

  db:
    image: mariadb
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=example
      - MYSQL_USER=example
      - MYSQL_PASSWORD=example
      - MYSQL_DATABASE=katalog
    volumes:
      - db-data:/var/lib/mysql
        #-./conf.d:/etc/mysql/conf.d
    ports:
      - 3306:3306

  front:
    container_name: front
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - connector

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  connector:
    build: ./connector
    container_name: connector
    tty: true
    stdin_open: true
    working_dir: /pg
    volumes:
      - ./connector:/pg
    entrypoint: ["gunicorn", "--workers", "4", "--bind", "0.0.0.0:5000", "app:app"]
    # entrypoint: ["flask", "run", "--debug", "--host=0.0.0.0"]
    ports:
      - "5000:5000"

  nginx:
    image: nginx:latest
    ports:
      - "80:80" # Expose Nginx on port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # Mount custom Nginx config
    depends_on:
      - front
      - connector

