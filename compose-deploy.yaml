services:

  db:
    # Changed from stock 'mariadb:latest' to your custom image containing the schema
    image: arturim13/katalog-db:latest
    container_name: mariadb
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=example
      - MYSQL_USER=example
      - MYSQL_PASSWORD=example
      - MYSQL_DATABASE=katalog
    volumes:
      # Mounted on your separate netdisk directory
      - /mnt/netdisk/db-data:/var/lib/mysql 
    ports:
      - 3306:3306
    configs:
      # Injects the buffer pool optimizations directly from the inline config below
      - source: mariadb_config
        target: /etc/mysql/conf.d/optimize.cnf

  front:
    container_name: front
    image: arturim13/katalog-front:latest
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - connector

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  connector:
    container_name: connector
    image: arturim13/katalog-connector:latest
    restart: always
    working_dir: /pg 
    tty: true
    stdin_open: true
    entrypoint: ["gunicorn", "--workers", "4", "--bind", "0.0.0.0:5000", "app:app"]
    ports:
      - "5000:5000"
    depends_on:
      - db

  nginx:
    container_name: nginx
    image: arturim13/katalog-nginx:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - front
      - connector

# Inline configuration to cache your netdisk data directly into system RAM
configs:
  mariadb_config:
    inline: |
      [mysqld]
      # NETDISK RAM-CACHING OPTIMIZATION
      # Allocates 1GB of RAM to pull tables off the netdisk once and store them in memory.
      # Adjust '1G' to 50% - 70% of your host's total available memory.
      innodb_buffer_pool_size = 1G
      innodb_buffer_pool_instances = 1
      
      # Throttle heavy writing tasks to prevent freezing slow network storage
      innodb_io_capacity = 200
      innodb_io_capacity_max = 400
      
      # Handle network latency gracefully by opening more I/O threads
      innodb_read_io_threads = 8
      innodb_write_io_threads = 8
